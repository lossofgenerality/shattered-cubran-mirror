<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuba Shattered 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one square 3D stage with a slim control strip under it; a single dark look, like a darkened room around the broken mirror. */
html{color-scheme:dark}
[hidden]{display:none!important}
body{margin:0}
:root{
  --bg:#0B0C0E; --surface:#15181C; --fg:#F2EDE4; --muted:#A9A296; --line:#2A2F36; --accent:#F0A640;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:14px; line-height:1.5;
  padding-block:20px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1024px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.stage{position:relative; width:100%; max-width:100%; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#07080A; touch-action:none; cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block; width:100%; height:100%}
.msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--muted); font-size:15px}
.controls{display:flex; flex-wrap:wrap; gap:14px 28px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 18px}
.ctl{display:flex; flex-direction:column; gap:4px; min-width:180px; flex:1 1 180px}
.ctl .top{display:flex; justify-content:space-between; gap:8px}
label{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
output{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent)}
button{font:inherit; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg); font-weight:600; cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hint{margin:0; font-size:12px; color:var(--muted)}
.foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted)}
.foot p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" role="img" aria-label="The shattered Cuba collage as solid pieces of glass, blown apart and seen from an angle. Each piece carries part of the artwork: a man in Havana searching rubbish, fish in a small boat, and the headline Cubans starve while, an hour away, people die of overeating.">
    <canvas id="gl"></canvas>
    <div class="msg" id="msg">Building the glass…</div>
  </div>

  <div class="controls">
    <div class="ctl">
      <div class="top"><label for="explode">Explode</label><output id="explodeOut" for="explode">1.00</output></div>
      <input type="range" id="explode" min="0" max="1.6" step="0.02" value="1">
    </div>
    <div class="ctl">
      <div class="top"><label for="thick">Glass thickness</label><output id="thickOut" for="thick">12 px</output></div>
      <input type="range" id="thick" min="4" max="28" step="1" value="12">
    </div>
    <button type="button" id="reset">Reset view</button>
    <p class="hint">Drag to turn the view. Scroll to zoom.</p>
  </div>

  <div class="foot">
    <p>Each shard is a solid slab of glass; its top face carries the shattered-mirror artwork.</p>
    <p>© 2026 Computational Classnotes · CC BY-NC-SA 4.0</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage'), cv = document.getElementById('gl'), msg = document.getElementById('msg');
  const exIn = document.getElementById('explode'), thIn = document.getElementById('thick');
  const exOut = document.getElementById('explodeOut'), thOut = document.getElementById('thickOut');

  /* ---------- shard layout: the same break pattern as the shattered-mirror design ---------- */
  function buildCells() {
    const W = 1024, H = 1024, P = [500, 560];
    let seed = 23;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const hash = (x) => { const v = Math.sin(x * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
    const rad = (a) => a * Math.PI / 180;
    const n = 22, angles = [];
    for (let i = 0; i < n; i++) angles.push(-180 + (i + 0.5) * 360 / n + (rnd() - 0.5) * 10);
    const edgeLen = (a) => {
      const dx = Math.cos(rad(a)), dy = Math.sin(rad(a));
      let t = 1e9;
      if (dx > 1e-6) t = Math.min(t, (W - P[0]) / dx);
      if (dx < -1e-6) t = Math.min(t, -P[0] / dx);
      if (dy > 1e-6) t = Math.min(t, (H - P[1]) / dy);
      if (dy < -1e-6) t = Math.min(t, -P[1] / dy);
      return t;
    };
    const lens = angles.map(edgeLen);
    const base = [24, 62, 128, 225, 355, 520];
    const R = angles.map((a, i) => base.map((b) => Math.min(lens[i], b * (0.85 + rnd() * 0.3))));
    const rp = (i, r) => {
      const L = Math.min(r, lens[i]), a = rad(angles[i]);
      const amp = L < 40 ? 2 : (L >= lens[i] - 1 ? 0 : 5);
      const j = (hash(i * 977 + L * 0.37) - 0.5) * amp;
      return [P[0] + Math.cos(a) * L - Math.sin(a) * j, P[1] + Math.sin(a) * L + Math.cos(a) * j];
    };
    const rayR = angles.map((a, i) => {
      const s = new Set([4, lens[i]]);
      for (let r = 16; r < lens[i]; r += 16) s.add(r);
      R[i].forEach((r) => s.add(r));
      return [...s].sort((x, y) => x - y);
    });
    const radialPoly = (i, ra, rb) => {
      const lo = Math.min(ra, rb), hi = Math.max(ra, rb);
      const list = rayR[i].filter((r) => r >= lo - 1e-6 && r <= hi + 1e-6);
      if (ra > rb) list.reverse();
      return list.map((r) => rp(i, r));
    };
    const present = angles.map((a, i) => {
      const j = (i + 1) % n;
      return base.map((b, k) => {
        if (R[i][k] > lens[i] - 14 || R[j][k] > lens[j] - 14) return false;
        return k <= 1 ? true : rnd() < 0.78;
      });
    });
    const segCache = {};
    const seg = (i, k) => {
      const key = i + '_' + k;
      if (segCache[key]) return segCache[key];
      const j = (i + 1) % n;
      const A = rp(i, R[i][k]), B = rp(j, R[j][k]);
      const out = [A];
      for (const t of [1 / 3, 2 / 3]) {
        const x = A[0] + (B[0] - A[0]) * t, y = A[1] + (B[1] - A[1]) * t;
        let ux = x - P[0], uy = y - P[1]; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
        const o = (hash(i * 31 + k * 7 + t * 13) - 0.5) * (k < 2 ? 4 : 9) + (k >= 2 ? 3 : 0);
        out.push([x + ux * o, y + uy * o]);
      }
      out.push(B);
      return (segCache[key] = out);
    };
    const corners = [[0, 0], [W, 0], [W, H], [0, H]].map((c) => ({ c, a: Math.atan2(c[1] - P[1], c[0] - P[0]) * 180 / Math.PI }));
    const cells = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a0 = angles[i]; let a1 = angles[j]; if (a1 <= a0) a1 += 360;
      const levels = [-1];
      present[i].forEach((p, k) => { if (p) levels.push(k); });
      levels.push('out');
      for (let q = 0; q < levels.length - 1; q++) {
        const a = levels[q], b = levels[q + 1];
        let pts = a === -1 ? [P] : seg(i, a).slice();
        const rja = a === -1 ? 4 : R[j][a], ria = a === -1 ? 4 : R[i][a];
        if (b === 'out') {
          pts = pts.concat(radialPoly(j, rja, lens[j]));
          const mid = corners.map((o) => { let x = o.a; while (x < a0) x += 360; while (x >= a0 + 360) x -= 360; return { c: o.c, a: x }; })
            .filter((o) => o.a > a0 && o.a < a1).sort((x, y) => y.a - x.a).map((o) => o.c);
          pts = pts.concat(mid, radialPoly(i, lens[i], ria));
        } else {
          pts = pts.concat(radialPoly(j, rja, R[j][b]), seg(i, b).slice().reverse(), radialPoly(i, R[i][b], ria));
        }
        cells.push({ pts, level: a === -1 ? 0 : a + 1 });
      }
    }
    // same random sequence as the 2D design, so the same pieces are missing
    const out = [];
    cells.forEach((c) => {
      const inner = c.level <= 2;
      if (!inner) rnd();
      rnd(); rnd(); rnd(); rnd(); rnd();
      const missing = c.level <= 1 ? rnd() < 0.18 : rnd() < 0.012;
      if (!inner && rnd() < 0.55) { rnd(); rnd(); for (let k = 0; k < 6; k++) rnd(); }
      const cx = c.pts.reduce((s, p) => s + p[0], 0) / c.pts.length;
      const cy = c.pts.reduce((s, p) => s + p[1], 0) / c.pts.length;
      if (!missing) out.push({ pts: c.pts, cx, cy, man: cy < P[1] - 10 });
    });
    // fresh randoms for the explosion
    out.forEach((s) => {
      let ux = s.cx - P[0], uy = s.cy - P[1];
      const dist = Math.hypot(ux, uy) || 1; ux /= dist; uy /= dist;
      s.ux = ux; s.uy = -uy;
      s.k = Math.max(0.06, Math.min(1, 1 - dist / 680));
      s.r = [rnd(), rnd(), rnd(), rnd(), rnd(), rnd()];
    });
    return out;
  }

  /* ---------- the artwork, painted flat, used as the texture for each shard's top face ---------- */
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = [];
    let line = '';
    words.forEach((w) => {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    });
    if (line) lines.push(line);
    return lines;
  }
  function panel(ctx, x, y, w, h, slant) {
    ctx.save();
    ctx.beginPath();
    if (slant === 'top') { ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.92, y + h); ctx.lineTo(x, y + h); }
    else { ctx.moveTo(x, y); ctx.lineTo(x + w * 0.94, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(6,8,10,0.88)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  function paintArtwork(img, photoTop) {
    const S = 2, c = document.createElement('canvas');
    c.width = c.height = 1024 * S;
    const x = c.getContext('2d');
    x.scale(S, S);
    x.fillStyle = '#0A0B0D'; x.fillRect(0, 0, 1024, 1024);
    x.drawImage(img, -79, photoTop, 1182, 680);
    x.textBaseline = 'top';

    // top-left panel
    x.font = '400 42px Anton, Impact, sans-serif';
    const head = wrap(x, 'CUBANS STARVE WHILE, AN HOUR AWAY, PEOPLE DIE OF OVEREATING.', 428);
    x.font = '400 15px Inter, system-ui, sans-serif';
    const quote = wrap(x, '“I’m trying to survive by going through the rubbish, finding anything I can sell or eat.”', 428);
    const h1 = 22 + 17 + 10 + head.length * 43.7 + 10 + quote.length * 21.75 + 24;
    panel(x, 28, 28, 500, h1, 'top');
    let yy = 50;
    x.font = '600 13px Inter, system-ui, sans-serif'; x.fillStyle = '#F0A640';
    try { x.letterSpacing = '2.9px'; } catch (e) {}
    x.fillText('CUBA · 2026', 52, yy);
    try { x.letterSpacing = '0px'; } catch (e) {}
    yy += 27;
    x.font = '400 42px Anton, Impact, sans-serif'; x.fillStyle = '#F2EDE4';
    head.forEach((l) => { x.fillText(l, 52, yy); yy += 43.7; });
    yy += 10;
    x.font = '400 15px Inter, system-ui, sans-serif'; x.fillStyle = '#D9D2C6';
    quote.forEach((l) => { x.fillText(l, 52, yy); yy += 21.75; });

    // bottom-left panel
    x.font = '400 36px Anton, Impact, sans-serif';
    const q = wrap(x, 'CAN YOU FISH FOR A LIVING FROM A STYROFOAM RAFT?', 372);
    x.font = '400 12px Inter, system-ui, sans-serif';
    const cr = wrap(x, 'Design and text © 2026 Computational Classnotes · CC BY-NC-SA 4.0', 372);
    const h2 = 22 + q.length * 38.2 + 10 + cr.length * 17.4 + 20;
    const y2 = 1024 - 28 - h2;
    panel(x, 28, y2, 440, h2, 'bottom');
    yy = y2 + 22;
    x.font = '400 36px Anton, Impact, sans-serif'; x.fillStyle = '#F2EDE4';
    q.forEach((l) => { x.fillText(l, 52, yy); yy += 38.2; });
    yy += 10;
    x.font = '400 12px Inter, system-ui, sans-serif'; x.fillStyle = '#B3ACA0';
    cr.forEach((l) => { x.fillText(l, 52, yy); yy += 17.4; });
    return c;
  }

  const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  /* ---------- 3D scene ---------- */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  } catch (e) {
    msg.textContent = 'This browser could not start 3D graphics, so the glass can’t be shown here. Try a recent Chrome, Edge, Firefox or Safari.';
    return;
  }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#07080A');
  const camera = new THREE.PerspectiveCamera(32, 1, 10, 9000);

  // a small studio for reflections on the glass
  const pm = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x1a1c20, side: THREE.BackSide })));
  const softbox = (hex, pos, size, power) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(power), side: THREE.DoubleSide }));
    m.position.set(pos[0], pos[1], pos[2]); m.lookAt(0, 0, 0); env.add(m);
  };
  softbox(0xffffff, [-3, 3.5, 4], [3.2, 1.6], 4);
  softbox(0xffd9a8, [4.2, 1, 3], [1.2, 3.2], 2.5);
  softbox(0x9fc4ff, [0, -4.4, 2], [4, 1], 1.5);
  scene.environment = pm.fromScene(env, 0.03).texture;

  scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x1a1410, 0.45));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(-650, 850, 1150);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -820, right: 820, top: 820, bottom: -820, near: 100, far: 4200 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.6;
  scene.add(sun);
  const warm = new THREE.PointLight(0xffb070, 0.55, 3200);
  warm.position.set(760, -260, 640);
  scene.add(warm);

  // the mirror's backing board and frame
  const board = new THREE.Mesh(new THREE.BoxGeometry(1120, 1120, 16), new THREE.MeshStandardMaterial({ color: 0x0c0d0f, roughness: 0.95 }));
  board.position.z = -34; board.receiveShadow = true; scene.add(board);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2621, roughness: 0.55, metalness: 0.2 });
  [[0, 548, 1120, 24], [0, -548, 1120, 24], [548, 0, 24, 1072], [-548, 0, 24, 1072]].forEach(([x, y, w, h]) => {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 40), frameMat);
    f.position.set(x, y, -8); f.castShadow = true; f.receiveShadow = true; scene.add(f);
  });

  const sideMat = new THREE.MeshPhysicalMaterial({ color: 0x8fbfb1, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.3 });
  let faceMan, faceFish, shards = [], group = new THREE.Group();
  scene.add(group);

  function makeFaceMat(canvas) {
    const t = new THREE.CanvasTexture(canvas);
    t.encoding = THREE.sRGBEncoding;
    t.repeat.set(1 / 1024, 1 / 1024);
    t.offset.set(0.5, 0.5);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return new THREE.MeshPhysicalMaterial({ map: t, roughness: 0.28, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 0.55 });
  }

  function buildMeshes(cells, thick) {
    group.children.forEach((m) => m.geometry.dispose());
    group.clear();
    shards = cells.map((s) => {
      const pts = [];
      s.pts.forEach((p) => {
        const v = new THREE.Vector2(p[0] - 512, 512 - p[1]);
        if (!pts.length || pts[pts.length - 1].distanceTo(v) > 0.05) pts.push(v);
      });
      if (pts.length > 2 && pts[0].distanceTo(pts[pts.length - 1]) < 0.05) pts.pop();
      const area = Math.abs(THREE.ShapeUtils.area(pts));
      const bevel = area > 700;
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), {
        depth: thick, steps: 1, bevelEnabled: bevel, bevelThickness: 1.2, bevelSize: 0.9, bevelSegments: 1, curveSegments: 1
      });
      const cx = s.cx - 512, cy = 512 - s.cy;
      geo.translate(-cx, -cy, 0);
      const mesh = new THREE.Mesh(geo, [s.man ? faceMan : faceFish, sideMat]);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData = { s, cx, cy };
      group.add(mesh);
      return mesh;
    });
  }

  function layout(e) {
    shards.forEach((m) => {
      const { s, cx, cy } = m.userData, k = s.k, r = s.r;
      const push = e * (10 + 46 * k + r[0] * 14);
      m.position.set(cx + s.ux * push, cy + s.uy * push, e * (6 + 150 * k * k * r[1] + 18 * r[2]));
      m.rotation.set(
        e * ((r[3] - 0.5) * 1.0 * k - s.uy * 0.28 * k),
        e * ((r[4] - 0.5) * 1.0 * k + s.ux * 0.28 * k),
        e * (r[5] - 0.5) * 0.45 * k
      );
    });
  }

  /* ---------- camera: an angled three-quarter view, draggable ---------- */
  const view = { az: -0.44, el: 0.28, dist: 2380 };
  const home = { ...view };
  const target = new THREE.Vector3(0, 0, 60);
  function placeCamera() {
    camera.position.set(
      target.x + view.dist * Math.cos(view.el) * Math.sin(view.az),
      target.y + view.dist * Math.sin(view.el),
      target.z + view.dist * Math.cos(view.el) * Math.cos(view.az)
    );
    camera.lookAt(target);
  }
  let need = true;
  const requestRender = () => { need = true; };
  function size() {
    const r = stage.getBoundingClientRect();
    if (!r.width) return;
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    requestRender();
  }
  new ResizeObserver(size).observe(stage);

  let drag = null;
  stage.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    view.az -= (e.clientX - drag.x) * 0.005;
    view.el = Math.max(-0.35, Math.min(1.25, view.el + (e.clientY - drag.y) * 0.005));
    drag = { x: e.clientX, y: e.clientY };
    placeCamera(); requestRender();
  });
  const endDrag = () => { drag = null; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.dist = Math.max(900, Math.min(4200, view.dist * (1 + e.deltaY * 0.001)));
    placeCamera(); requestRender();
  }, { passive: false });
  document.getElementById('reset').addEventListener('click', () => { Object.assign(view, home); placeCamera(); requestRender(); });

  let cells = null, thickTimer = 0;
  exIn.addEventListener('input', () => {
    exOut.textContent = (+exIn.value).toFixed(2);
    if (cells) { layout(+exIn.value); requestRender(); }
  });
  thIn.addEventListener('input', () => {
    thOut.textContent = thIn.value + ' px';
    clearTimeout(thickTimer);
    thickTimer = setTimeout(() => { if (cells) { buildMeshes(cells, +thIn.value); layout(+exIn.value); requestRender(); } }, 120);
  });

  function loop() {
    if (need) { need = false; renderer.render(scene, camera); }
    requestAnimationFrame(loop);
  }

  async function start() {
    placeCamera(); size(); loop();
    try {
      if (document.fonts && document.fonts.load) {
        await Promise.all([
          document.fonts.load('400 42px Anton'),
          document.fonts.load('400 15px Inter'),
          document.fonts.load('600 13px Inter')
        ]).catch(() => {});
      }
      const [man, fish] = await Promise.all([loadImg('rubbish.jpg'), loadImg('fish.jpg')]);
      faceMan = makeFaceMat(paintArtwork(man, 0));
      faceFish = makeFaceMat(paintArtwork(fish, 400));
      cells = buildCells();
      buildMeshes(cells, +thIn.value);
      layout(+exIn.value);
      msg.hidden = true;
      requestRender();
    } catch (e) {
      msg.textContent = 'The photos for the glass did not load. Reload the page to try again.';
    }
  }
  start();
})();
</script>
</body>
</html>
